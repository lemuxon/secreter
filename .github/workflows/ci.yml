name: CI

# ⚠️ Bu deponun dalı `master`. Tetikleyici `main`/`develop`'a bakıyordu ve
# CI bu yüzden HİÇ çalışmadı — depoda bir `ci.yml` göründüğü için
# "testler otomatik koşuyor" sanılıyordu. Dal adı değişirse burası da
# değişmeli; aşağıdaki `build` işinin `if:` koşulu da aynı dalı yazar.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Aynı dal için üst üste gelen çalıştırmaları iptal et (runner tasarrufu)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # 1. Statik analiz + format
  # ────────────────────────────────────────────
  analyze:
    name: Analiz & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🪤 SÜRÜM SABITLENDİ — `3.x` DEĞİL.
      #
      # `3.x` her zaman en son stable'ı çeker. CI'nin ilk çalıştırması (#1)
      # tam olarak bu yüzden `Statik analiz` adımında düştü: kodda hiçbir
      # değişiklik yokken, yalnızca CI yerelden daha yeni bir SDK
      # kullandığı için. Yeni SDK = yeni lint kuralları, ve bu projenin
      # kapısı SIFIR bulgu (info dahil) istiyor.
      #
      # `dart format` da aynı riski taşır — biçimlendirici sürümler
      # arasında çıktı değiştirir — ama #1'de düşen o değildi.
      #
      # Sabit sürüm olmadan bir katkıcının PR'ı, Flutter dün yeni bir
      # stable yayınladığı için kırmızıya düşerdi. Kapıların doğruladığı
      # sürüm burada yazılı olmalı.
      #
      # Yükseltirken: yerelde aynı sürüme geç, `dart format` çalıştır,
      # `flutter analyze` 0 bulgu versin, sonra burayı güncelle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'   # Dart 3.12.2 — kapılar bununla doğrulandı
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed .

      # NOT: `flutter analyze` VARSAYILAN olarak warning'lerde de başarısız
      # olur. Depoda 6 warning bulunduğu için bu adım sessizce kırmızıydı ve
      # `needs: analyze` zinciri yüzünden test/build işleri HİÇ ÇALIŞMIYORDU.
      # Warning'ler giderildi; kapı bilinçli olarak sıkı tutuluyor.
      #
      # ⚠️ `--no-fatal-infos` KALDIRILDI. Projenin yerel kapısı SIFIR bulgu
      # (info dahil) istiyor; CI daha gevşek olsaydı info düzeyinde bir
      # gerileme CI'dan geçer, yerelde kırılırdı — yani CI yanlış güven
      # verirdi. İki kapı aynı sıkılıkta olmalı.
      - name: Statik analiz
        run: flutter analyze

  # ────────────────────────────────────────────
  # 2. Birim ve widget testleri
  # ────────────────────────────────────────────
  test:
    name: Testler
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'   # analyze işiyle AYNI sürüm olmalı
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      # 🪤 `flutter pub get` MATERIAL FONTLARINI İNDİRMEZ.
      #
      # `security_banners_test.dart` kırpılmayı GERÇEK Roboto metrikleriyle
      # ölçer; yedek font her glifi 1em çizdiği için onunla ölçmek yanlış
      # alarm verir. Fontı
      # `$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/` altından
      # okur — ve o dizin precache çalışmadan BOŞTUR.
      #
      # CI #2 tam bu yüzden düştü: 576 geçti, 1 düştü (grubun
      # `setUpAll`'ı), ve o grubun 63 testi hiç koşmadı — 640 yerine 577.
      #
      # Testın font yoksa ATLAMASI düzeltme DEĞİLDİR: o zaman kapı
      # yeşil görünür ama hiçbir şey ölçmez.
      - name: Material fontlarını indir (gerçek metrikli testler için)
        run: flutter precache --universal

      # Test çıktısı iş loglarında kalır ve logları görmek GitHub oturumu
      # ister. Düşen testin GERÇEK sebebini annotation olarak da yayıyoruz:
      # böylece "1 failed" özetiyle yetinmek yerine neden düştüğü
      # dışarıdan da görünür olur.
      - name: Testleri çalıştır (coverage ile)
        run: |
          set -o pipefail
          if flutter test --coverage --reporter expanded 2>&1 | tee test-output.log; then
            exit 0
          fi
          echo "::group::Son 80 satır"
          tail -n 80 test-output.log
          echo "::endgroup::"
          grep -nE "Expected:|Actual:|Exception|Error:|reason:|FAILED|bulunamad" test-output.log | head -20 > hata.txt || true
          while IFS= read -r satir; do
            echo "::error::$satir"
          done < hata.txt
          exit 1

      - name: Test çıktısını sakla (düştüyse)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 7

      - name: Coverage raporu yükle
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────────────────────
  # 3. Firestore GÜVENLİK KURALLARI testleri
  #
  # Bu iş kritiktir: uygulamanın yetkilendirmesinin tamamı kurallarda
  # yaşıyor ve kural dosyası derlenmediği için sessizce bozulabilir.
  # ────────────────────────────────────────────
  rules:
    name: Güvenlik Kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # firebase-tools emulator'ü JDK 21+ ister
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Firebase CLI kur
        run: npm install -g firebase-tools

      - name: Test bağımlılıkları
        run: npm --prefix test/rules ci

      - name: Kuralları emulator'de doğrula
        run: |
          firebase emulators:exec --only firestore \
            --project secreter-rules-test \
            "npm --prefix test/rules test"

  # ────────────────────────────────────────────
  # 4. Cloud Functions denetimi
  # ────────────────────────────────────────────
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm --prefix functions ci

      - name: Sözdizimi kontrolü
        run: node --check functions/index.js

      # Yerel kapı `cd functions && node --test` çalıştırıyordu ama CI
      # çalıştırmıyordu: iki kapı aynı sıkılıkta olmalı.
      - name: Birim testleri
        run: npm --prefix functions test

      # ⚠️ SÖZDİZİMİ GEÇMESİ DAĞITILABİLİR OLMAK DEĞİLDİR (§4n).
      #
      # Dağıtım aylarca şu hatayla düşüyordu:
      #   "User code failed to load. Cannot determine backend specification."
      # Sebep: `admin.storage().bucket()` MODÜL SEVİYESİNDE çağrılıyordu ve
      # ortamda `storageBucket` yoksa fırlatıyordu. `node --check` bunu
      # göremez — sözdizimi kusursuzdu.
      #
      # Firebase CLI dağıtımdan önce kodu tam olarak böyle yükler; bu adım
      # o kontrolü CI'ya taşır.
      - name: Modül yüklenebiliyor mu (dağıtım ön koşulu)
        working-directory: functions
        env:
          GCLOUD_PROJECT: ci-yukleme-denemesi
        run: node -e "require('./index.js'); console.log('modul yuklendi')"

  # ────────────────────────────────────────────
  # 5. APK derleme (yalnızca main'e push)
  # ────────────────────────────────────────────
  build:
    name: APK Derle
    runs-on: ubuntu-latest
    needs: [test, rules, functions]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'   # analyze işiyle AYNI sürüm olmalı
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Firebase config oluştur
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d \
            > android/app/google-services.json
        continue-on-error: true

      # ⚠️ İMZA: keystore CI'da yoksa `release` imzasız kalır ve derleme
      # başarısız olur — bu İSTENEN davranıştır. Eskiden imza yokken
      # release, DEBUG anahtarıyla imzalanıp "yayına hazır" artefakt olarak
      # yükleniyordu; bu tehlikeli bir yanılsamaydı.
      #
      # Sırlar tanımlıysa gerçek imzayla release, değilse debug APK üretilir.
      - name: Keystore hazırla (varsa)
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d \
              > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK derle (imzalı)
        if: steps.keystore.outputs.present == 'true'
        env:
          SECRETER_STORE_FILE: ${{ runner.temp }}/release.jks
          SECRETER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SECRETER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SECRETER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} \
            --dart-define=SECRETER_TURN_URL=${{ secrets.TURN_URL }} \
            --dart-define=SECRETER_TURN_USER=${{ secrets.TURN_USER }} \
            --dart-define=SECRETER_TURN_PASS=${{ secrets.TURN_PASS }}

      - name: Debug APK derle (imza yoksa)
        if: steps.keystore.outputs.present != 'true'
        run: flutter build apk --debug

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.keystore.outputs.present == 'true' && 'release' || 'debug' }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
