# JVM belleği: 8G heap + 4G metaspace istemek, 7 GB RAM'li CI çalıştırıcılarında
# (GitHub-hosted runner) Gradle daemon'ın hiç başlamamasına veya OOM ile
# düşmesine yol açıyordu. 4G heap bu proje için fazlasıyla yeterli.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
